name: APIKS native check

on:
  push:
    branches:
      - fix/play-context-20261030
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apiks-native-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ios:
    name: Unsigned iOS build and tests
    runs-on: macos-26
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Generate Xcode project
        run: |
          set -euo pipefail
          xcodebuild -version
          brew install xcodegen
          xcodegen generate
          test -f Piks.xcodeproj/project.pbxproj
          mkdir -p build/ci

      - name: Build app and share extension without signing
        run: |
          set -euo pipefail
          xcodebuild build \
            -project Piks.xcodeproj \
            -scheme App \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ci/derived \
            CODE_SIGNING_ALLOWED=NO > build/ci/app-build.log 2>&1 || {
              tail -n 120 build/ci/app-build.log
              exit 1
            }
          tail -n 12 build/ci/app-build.log

      - name: Select available iPhone simulator
        run: |
          set -euo pipefail
          xcrun simctl list devices available -j > build/ci/simulators.json
          SIM_ID="$(python3 - <<'PY'
          import json

          with open('build/ci/simulators.json', encoding='utf-8') as source:
              devices = json.load(source)['devices']
          iphones = [
              (runtime, device['udid'])
              for runtime, available in devices.items() if 'iOS-' in runtime
              for device in available if device['name'].startswith('iPhone')
          ]
          if not iphones:
              raise SystemExit('No available iPhone simulator')
          print(max(iphones)[1])
          PY
          )"
          echo "SIM_ID=$SIM_ID" >> "$GITHUB_ENV"

      - name: Test media file request lifecycle
        run: |
          set -euo pipefail
          xcodebuild test -project Piks.xcodeproj -scheme MediaRequestTests \
            -destination 'platform=macOS' -parallel-testing-enabled NO \
            -derivedDataPath build/ci/derived CODE_SIGNING_ALLOWED=NO \
            > build/ci/media-request-tests.log 2>&1 || {
              tail -n 100 build/ci/media-request-tests.log
              exit 1
            }
          tail -n 12 build/ci/media-request-tests.log

      - name: Run reversal tests
        run: |
          set -euo pipefail
          xcodebuild test \
            -project Piks.xcodeproj \
            -scheme ReverseTests \
            -destination "platform=iOS Simulator,id=$SIM_ID" \
            -parallel-testing-enabled NO \
            -derivedDataPath build/ci/derived \
            -resultBundlePath build/ci/reverse.xcresult \
            CODE_SIGNING_ALLOWED=NO > build/ci/reverse-tests.log 2>&1 || {
              tail -n 120 build/ci/reverse-tests.log
              xcrun xcresulttool get test-results summary \
                --path build/ci/reverse.xcresult > build/ci/reverse-summary.json 2>/dev/null || true
              python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          messages = []
          try:
              summary = json.loads(Path('build/ci/reverse-summary.json').read_text())
              messages = [
                  f"{failure.get('testName', 'test')}: {failure.get('failureText', 'failed')}"
                  for failure in summary.get('testFailures', [])[:3]
              ]
          except (OSError, ValueError):
              pass
          if not messages:
              lines = Path('build/ci/reverse-tests.log').read_text(errors='replace').splitlines()
              messages = [
                  line for line in lines
                  if re.search(r'error:|Test Case .* failed|Testing failed:', line, re.I)
              ][-3:]
          for message in messages or ['xcodebuild test failed; see failure artifact']:
              message = ' '.join(message.split())[:500].replace('%', '%25')
              print(f'::error title=Run reversal tests::{message}')
          PY
              exit 1
            }
          tail -n 12 build/ci/reverse-tests.log

      - name: Run wrapper input UI tests
        run: |
          set -euo pipefail
          xcodebuild test \
            -project Piks.xcodeproj \
            -scheme WrapperInputTests \
            -destination "platform=iOS Simulator,id=$SIM_ID" \
            -parallel-testing-enabled NO \
            -derivedDataPath build/ci/derived \
            -resultBundlePath build/ci/wrapper.xcresult \
            CODE_SIGNING_ALLOWED=NO > build/ci/wrapper-tests.log 2>&1 || {
              tail -n 120 build/ci/wrapper-tests.log
              exit 1
            }
          tail -n 12 build/ci/wrapper-tests.log

      - name: Save failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: apiks-native-failure-${{ github.run_id }}
          path: |
            build/ci/*.log
            build/ci/*.xcresult/**
          if-no-files-found: warn
          retention-days: 1
