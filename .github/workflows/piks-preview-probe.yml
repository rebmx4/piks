name: APIKS cut preview probe
on:
  push:
    branches: [test/cut-preview-probe-20261109]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check real decoded frames around cuts and seeks
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen generate
          mkdir -p build/probe
          xcodebuild test -project Piks.xcodeproj -scheme ExportMacTests \
            -destination 'platform=macOS' -parallel-testing-enabled NO \
            -only-testing:ExportMacTests/PreviewCutPlaybackTests \
            -derivedDataPath build/probe/derived CODE_SIGNING_ALLOWED=NO \
            > build/probe/preview.log 2>&1 || {
              tail -n 100 build/probe/preview.log
              exit 1
            }
          grep -E 'CUT-PREVIEW|Executed |TEST SUCCEEDED' build/probe/preview.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: cut-preview-probe
          path: build/probe/preview.log
          retention-days: 3
