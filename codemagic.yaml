workflows:
  native-validate:
    name: APIKS Native — compile and XCTest
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Native architecture checks
        script: python3 scripts/native/check_structure.py
      - name: Core Swift tests
        script: cd NativeCore && swift test --jobs 2
      - name: Install XcodeGen
        script: HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
      - name: Generate isolated native project
        script: xcodegen generate --spec project-native.yml
      - name: Simulator compile and media tests
        script: |
          set -e
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for a in d["devices"].values() for x in a if "iPhone" in x["name"]))')
          xcodebuild test -project PiksNative.xcodeproj -scheme PiksNative \
            -destination "platform=iOS Simulator,id=$DEVICE" \
            -resultBundlePath build/native-tests.xcresult \
            CODE_SIGNING_ALLOWED=NO > build-native.log 2>&1 || {
              tail -n 100 build-native.log
              exit 1
            }
          tail -n 18 build-native.log
    artifacts:
      - build-native.log
      - build/native-tests.xcresult
  ios-app-store:
    name: Piks iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: konspa
    environment:
      groups:
        - piks_signing
      xcode: latest
      vars:
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.piks.app"
    # Автозапуск по отправке в main отключён по решению владельца 23.09.2026:
    # агент готовит сборку, владелец запускает её сам кнопкой «Start new build».
    # Чтобы вернуть автозапуск — раскомментировать блок ниже.
    #
    # triggering:
    #   events:
    #     - push
    #   branch_patterns:
    #     - pattern: main
    #       include: true
    scripts:
      - name: Install XcodeGen
        script: HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
      - name: Generate Xcode project
        script: |
          cd "$CM_BUILD_DIR"
          xcodegen generate
      - name: Set up code signing (create cert+profile via ASC API key)
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          echo "BUNDLE_ID=$BUNDLE_ID"
          if [ -z "$CERTIFICATE_PRIVATE_KEY" ]; then
            echo "ERROR: CERTIFICATE_PRIVATE_KEY is EMPTY (add it to group piks_signing, Secret)."
            exit 1
          fi
          echo "CERTIFICATE_PRIVATE_KEY length: ${#CERTIFICATE_PRIVATE_KEY}"
          keychain initialize
          echo "$CERTIFICATE_PRIVATE_KEY" | openssl base64 -A -d -out /tmp/cert_key.pem
          echo "decoded key head: $(head -1 /tmp/cert_key.pem)"
          echo "===== app-store-connect fetch-signing-files ====="
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@file:/tmp/cert_key.pem \
            --create \
            --verbose
          # Сборка №19: «Поделиться → APIKS» — своё расширение со своим профилем
          # (группа приложений group.com.piks.app — у обоих в кабинете Apple).
          app-store-connect fetch-signing-files "$BUNDLE_ID.share" \
            --type IOS_APP_STORE \
            --certificate-key=@file:/tmp/cert_key.pem \
            --create \
            --verbose
          keychain add-certificates
          echo "===== Applying profiles to project ====="
          xcode-project use-profiles --verbose
      - name: Set build number
        script: |
          cd "$CM_BUILD_DIR"
          BN=$(date +%s)
          agvtool new-version -all "$BN"
      - name: Build IPA
        script: |
          cd "$CM_BUILD_DIR"
          xcode-project build-ipa \
            --project "Piks.xcodeproj" \
            --scheme "$XCODE_SCHEME" || {
              echo "===== BUILD FAILED — error lines ====="
              grep -h -A3 "error:" /tmp/xcodebuild_logs/*.log 2>/dev/null | tail -n 60
              tail -n 40 /tmp/xcodebuild_logs/*.log 2>/dev/null
              exit 1
            }
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - rerebmx@gmail.com
        notify:
          success: true
          failure: true
