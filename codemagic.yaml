workflows:
  ios-app-store:
    name: Piks iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: konspa
    environment:
      groups:
        - piks_signing
      xcode: latest
      vars:
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.piks.app"
    # Автозапуск по отправке в main отключён по решению владельца 23.09.2026:
    # агент готовит сборку, владелец запускает её сам кнопкой «Start new build».
    # Чтобы вернуть автозапуск — раскомментировать блок ниже.
    #
    # triggering:
    #   events:
    #     - push
    #   branch_patterns:
    #     - pattern: main
    #       include: true
    scripts:
      - name: Install XcodeGen
        script: HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
      - name: Generate Xcode project
        script: |
          cd "$CM_BUILD_DIR"
          xcodegen generate
      - name: Set up code signing (create cert+profile via ASC API key)
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          echo "BUNDLE_ID=$BUNDLE_ID"
          if [ -z "$CERTIFICATE_PRIVATE_KEY" ]; then
            echo "ERROR: CERTIFICATE_PRIVATE_KEY is EMPTY (add it to group piks_signing, Secret)."
            exit 1
          fi
          echo "CERTIFICATE_PRIVATE_KEY length: ${#CERTIFICATE_PRIVATE_KEY}"
          keychain initialize
          echo "$CERTIFICATE_PRIVATE_KEY" | openssl base64 -A -d -out /tmp/cert_key.pem
          echo "decoded key head: $(head -1 /tmp/cert_key.pem)"
          echo "===== app-store-connect fetch-signing-files ====="
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@file:/tmp/cert_key.pem \
            --create \
            --verbose
          # Сборка №19: «Поделиться → APIKS» — своё расширение со своим профилем
          # (группа приложений group.com.piks.app — у обоих в кабинете Apple).
          app-store-connect fetch-signing-files "$BUNDLE_ID.share" \
            --type IOS_APP_STORE \
            --certificate-key=@file:/tmp/cert_key.pem \
            --create \
            --verbose
          keychain add-certificates
          echo "===== Applying profiles to project ====="
          xcode-project use-profiles --verbose
      - &reverse_tests
        name: Test video and audio reversal
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          mkdir -p build/reverse-tests
          if [ "${RYNDI_REUSE_REVERSE_FROM:-}" = "6ac74727d8dbd069398bbc5d" ] &&
             [ "$(git rev-parse HEAD:App/ReverseMedia.swift)" = "ef0bf3d6e5eb006704282e4f888b2fe5fdb4f628" ] &&
             [ "$(git rev-parse HEAD:Tests/ReverseMediaTests.swift)" = "ef256f6839876af39c16be7bbbf3f5debd723230" ] &&
             [ "$(xcodebuild -version | tr '\n' ' ')" = "Xcode 26.6 Build version 17F113 " ]; then
            echo "Reusing 5 passed reversal tests from build 34: identical sources and Xcode."
            exit 0
          fi
          xcrun simctl list devices available -j > build/reverse-tests/devices.json
          SIM_ID=$(python3 -c 'import json; d=json.load(open("build/reverse-tests/devices.json")); print(next(x["udid"] for r, a in d["devices"].items() if "iOS" in r for x in a if "iPhone" in x["name"]))')
          xcodebuild test -project Piks.xcodeproj -scheme ReverseTests \
            -destination "platform=iOS Simulator,id=$SIM_ID" \
            -derivedDataPath build/reverse-tests/derived \
            -resultBundlePath build/reverse-tests/ReverseTests.xcresult \
            CODE_SIGNING_ALLOWED=NO > build/reverse-tests/test.log 2>&1 || {
              tail -n 90 build/reverse-tests/test.log
              exit 1
            }
          tail -n 12 build/reverse-tests/test.log
      - name: Test portrait export and stereo sound
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          mkdir -p build/export-tests
          xcodebuild test -project Piks.xcodeproj -scheme ExportMacTests \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath build/export-tests/derived \
            -resultBundlePath build/export-tests/ExportTests.xcresult \
            CODE_SIGNING_ALLOWED=NO > build/export-tests/test.log 2>&1 || {
              tail -n 80 build/export-tests/test.log
              exit 1
            }
          tail -n 12 build/export-tests/test.log
      - name: Set build number
        script: |
          cd "$CM_BUILD_DIR"
          BN=$(date +%s)
          agvtool new-version -all "$BN"
      - name: Build IPA
        script: |
          cd "$CM_BUILD_DIR"
          xcode-project build-ipa \
            --project "Piks.xcodeproj" \
            --scheme "$XCODE_SCHEME" || {
              echo "===== BUILD FAILED — error lines ====="
              grep -h -A3 "error:" /tmp/xcodebuild_logs/*.log 2>/dev/null | tail -n 60
              tail -n 40 /tmp/xcodebuild_logs/*.log 2>/dev/null
              exit 1
            }
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - build/reverse-tests/test.log
      - build/reverse-tests/ReverseTests.xcresult
      - build/export-tests/test.log
      - build/export-tests/ExportTests.xcresult
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - rerebmx@gmail.com
        notify:
          success: true
          failure: true

  ios-native-tests:
    name: Piks native tests (no IPA or publishing)
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Install XcodeGen
        script: HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
      - name: Generate Xcode project
        script: |
          cd "$CM_BUILD_DIR"
          xcodegen generate
      - *reverse_tests
    artifacts:
      - build/reverse-tests/test.log
      - build/reverse-tests/ReverseTests.xcresult

  mac-native-tests:
    name: Piks AVFoundation tests on Mac (no IPA or publishing)
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Install XcodeGen
        script: HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
      - name: Generate Xcode project
        script: |
          cd "$CM_BUILD_DIR"
          xcodegen generate
      - name: Test reversal on native Mac
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          mkdir -p build/reverse-tests
          xcodebuild test -project Piks.xcodeproj -scheme ReverseMacTests \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath build/reverse-tests/derived \
            -resultBundlePath build/reverse-tests/ReverseTests.xcresult \
            CODE_SIGNING_ALLOWED=NO > build/reverse-tests/test.log 2>&1 || {
              tail -n 90 build/reverse-tests/test.log
              exit 1
            }
          tail -n 12 build/reverse-tests/test.log
    artifacts:
      - build/reverse-tests/test.log
      - build/reverse-tests/ReverseTests.xcresult
