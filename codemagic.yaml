workflows:
  native-validate:
    name: APIKS Native — compile and XCTest
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Native architecture checks
        script: python3 scripts/native/check_structure.py
      - name: Core Swift tests
        script: cd NativeCore && swift test --jobs 2
      - name: Install XcodeGen
        script: HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
      - name: Generate isolated native project
        script: xcodegen generate --spec project-native.yml
      - name: Simulator compile and media tests
        script: |
          set -e
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for a in d["devices"].values() for x in a if "iPhone" in x["name"]))')
          xcodebuild test -project PiksNative.xcodeproj -scheme PiksNative \
            -destination "platform=iOS Simulator,id=$DEVICE" \
            -resultBundlePath build/native-tests.xcresult \
            CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=YES CODE_SIGN_IDENTITY="-" > build-native.log 2>&1 || {
              tail -n 100 build-native.log
              exit 1
            }
          tail -n 18 build-native.log
    artifacts:
      - build-native.log
      - build/native-tests.xcresult
  native-testflight:
    name: APIKS Native — signed IPA and TestFlight
    max_build_duration: 30
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: konspa
    environment:
      groups:
        - piks_signing
      xcode: latest
      vars:
        BUNDLE_ID: "com.piks.app.native"
        HOMEBREW_NO_INSTALL_CLEANUP: "1"
    scripts:
      - name: Native architecture checks
        script: python3 scripts/native/check_structure.py
      - name: Install XcodeGen
        script: HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
      - name: Generate isolated native project
        script: xcodegen generate --spec project-native.yml
      - name: Register native identifier and Apple sign-in capability
        script: |
          set -euo pipefail
          test "$BUNDLE_ID" = "com.piks.app.native"
          app-store-connect bundle-ids list --bundle-id-identifier "$BUNDLE_ID" \
            --strict-match-identifier --json > native-identifiers.json
          NATIVE_ID=$(python3 -c 'import json; d=json.load(open("native-identifiers.json")); rows=d if isinstance(d,list) else d.get("data",[d]); print(next((r["id"] for r in rows if r.get("attributes",r).get("identifier")=="com.piks.app.native"),""))')
          if [ -z "$NATIVE_ID" ]; then
            app-store-connect bundle-ids create "$BUNDLE_ID" --name "APIKS Native" \
              --platform IOS --json > native-identifier.json
            NATIVE_ID=$(python3 -c 'import json; d=json.load(open("native-identifier.json")); print(d.get("data",d)["id"])')
          fi
          CLI_BIN=$(command -v app-store-connect)
          IFS= read -r CLI_SHEBANG < "$CLI_BIN"
          CLI_INTERPRETER="${CLI_SHEBANG:2}"
          CLI_PYTHON=
          for CANDIDATE in "$CLI_INTERPRETER" "$(dirname "$CLI_BIN")/python3" \
            "$(dirname "$CLI_BIN")/python" "$(command -v python3)"; do
            if [ -x "$CANDIDATE" ] && "$CANDIDATE" -c \
              'import jwt; from codemagic.tools.app_store_connect.arguments import Types' \
              >/dev/null 2>&1; then
              CLI_PYTHON="$CANDIDATE"
              break
            fi
          done
          test -n "$CLI_PYTHON" || { echo "Codemagic CLI Python is unavailable."; exit 1; }
          "$CLI_PYTHON" -m scripts.native.configure_apple "$NATIVE_ID"
      - name: Fetch signing files for the native app
        script: |
          set -euo pipefail
          test -n "${CERTIFICATE_PRIVATE_KEY:-}" || { echo "Signing key is not configured in piks_signing."; exit 1; }
          SIGNING_KEY=$(mktemp "${TMPDIR:-/tmp}/piks-native-cert.XXXXXX")
          trap 'rm -f "$SIGNING_KEY"' EXIT
          chmod 600 "$SIGNING_KEY"
          printf '%s' "$CERTIFICATE_PRIVATE_KEY" | openssl base64 -A -d -out "$SIGNING_KEY"
          openssl pkey -in "$SIGNING_KEY" -noout
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE \
            --certificate-key="@file:$SIGNING_KEY" --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Set native build number
        script: agvtool new-version -all "$(date +%s)"
      - name: Build native IPA
        script: |
          set -euo pipefail
          xcode-project build-ipa --project PiksNative.xcodeproj --scheme PiksNative
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
  ios-app-store:
    name: Piks iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: konspa
    environment:
      groups:
        - piks_signing
      xcode: latest
      vars:
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.piks.app"
    # Автозапуск по отправке в main отключён по решению владельца 23.09.2026:
    # агент готовит сборку, владелец запускает её сам кнопкой «Start new build».
    # Чтобы вернуть автозапуск — раскомментировать блок ниже.
    #
    # triggering:
    #   events:
    #     - push
    #   branch_patterns:
    #     - pattern: main
    #       include: true
    scripts:
      - name: Install XcodeGen
        script: HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
      - name: Generate Xcode project
        script: |
          cd "$CM_BUILD_DIR"
          xcodegen generate
      - name: Set up code signing (create cert+profile via ASC API key)
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          echo "BUNDLE_ID=$BUNDLE_ID"
          if [ -z "$CERTIFICATE_PRIVATE_KEY" ]; then
            echo "ERROR: CERTIFICATE_PRIVATE_KEY is EMPTY (add it to group piks_signing, Secret)."
            exit 1
          fi
          echo "CERTIFICATE_PRIVATE_KEY length: ${#CERTIFICATE_PRIVATE_KEY}"
          keychain initialize
          echo "$CERTIFICATE_PRIVATE_KEY" | openssl base64 -A -d -out /tmp/cert_key.pem
          echo "decoded key head: $(head -1 /tmp/cert_key.pem)"
          echo "===== app-store-connect fetch-signing-files ====="
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@file:/tmp/cert_key.pem \
            --create \
            --verbose
          # Сборка №19: «Поделиться → APIKS» — своё расширение со своим профилем
          # (группа приложений group.com.piks.app — у обоих в кабинете Apple).
          app-store-connect fetch-signing-files "$BUNDLE_ID.share" \
            --type IOS_APP_STORE \
            --certificate-key=@file:/tmp/cert_key.pem \
            --create \
            --verbose
          keychain add-certificates
          echo "===== Applying profiles to project ====="
          xcode-project use-profiles --verbose
      - name: Set build number
        script: |
          cd "$CM_BUILD_DIR"
          BN=$(date +%s)
          agvtool new-version -all "$BN"
      - name: Build IPA
        script: |
          cd "$CM_BUILD_DIR"
          xcode-project build-ipa \
            --project "Piks.xcodeproj" \
            --scheme "$XCODE_SCHEME" || {
              echo "===== BUILD FAILED — error lines ====="
              grep -h -A3 "error:" /tmp/xcodebuild_logs/*.log 2>/dev/null | tail -n 60
              tail -n 40 /tmp/xcodebuild_logs/*.log 2>/dev/null
              exit 1
            }
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - rerebmx@gmail.com
        notify:
          success: true
          failure: true
