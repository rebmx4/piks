workflows:
  ios-app-store:
    name: Piks iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: konspa
    environment:
      groups:
        - piks_signing
      xcode: latest
      vars:
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.piks.app"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Install XcodeGen
        script: HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
      - name: Generate Xcode project
        script: |
          cd "$CM_BUILD_DIR"
          xcodegen generate
      - name: Set up code signing (create cert+profile via ASC API key)
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          echo "BUNDLE_ID=$BUNDLE_ID"
          if [ -z "$CERTIFICATE_PRIVATE_KEY" ]; then
            echo "ERROR: CERTIFICATE_PRIVATE_KEY is EMPTY (add it to group piks_signing, Secret)."
            exit 1
          fi
          echo "CERTIFICATE_PRIVATE_KEY length: ${#CERTIFICATE_PRIVATE_KEY}"
          keychain initialize
          echo "$CERTIFICATE_PRIVATE_KEY" | openssl base64 -A -d -out /tmp/cert_key.pem
          echo "decoded key head: $(head -1 /tmp/cert_key.pem)"
          echo "===== app-store-connect fetch-signing-files ====="
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@file:/tmp/cert_key.pem \
            --create \
            --verbose
          keychain add-certificates
          xcode-project use-profiles --verbose
          echo "===== installed provisioning profiles ====="
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles/" 2>/dev/null || true
          PC=$(ls "$HOME/Library/MobileDevice/Provisioning Profiles/" 2>/dev/null | wc -l | tr -d ' ')
          echo "profile count: $PC"
          if [ "$PC" = "0" ]; then
            echo "FATAL: no provisioning profile was created for $BUNDLE_ID — see the fetch-signing-files output above."
            exit 1
          fi
      - name: Set build number
        script: |
          cd "$CM_BUILD_DIR"
          BN=$(date +%s)
          agvtool new-version -all "$BN"
      - name: Build IPA
        script: |
          cd "$CM_BUILD_DIR"
          xcode-project build-ipa \
            --project "Piks.xcodeproj" \
            --scheme "$XCODE_SCHEME" || {
              echo "===== BUILD FAILED — error lines ====="
              grep -h -A3 "error:" /tmp/xcodebuild_logs/*.log 2>/dev/null | tail -n 60
              tail -n 40 /tmp/xcodebuild_logs/*.log 2>/dev/null
              exit 1
            }
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - rerebmx@gmail.com
        notify:
          success: true
          failure: true
