name: Piks

options:
  bundleIdPrefix: com.piks
  deploymentTarget:
    iOS: "15.0"
  developmentLanguage: ru
  generateEmptyDirectories: true

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_LANGUAGE: ru

targets:
  App:
    type: application
    platform: iOS
    sources:
      - path: App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.piks.app
        PRODUCT_NAME: Piks
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: GR3WB4Z646
        CODE_SIGN_STYLE: Manual
        # Сборка №19: общая папка с «Поделиться → APIKS» (группа приложений).
        CODE_SIGN_ENTITLEMENTS: App/App.entitlements
    dependencies:
      - target: ShareExtension
        embed: true

  # «Поделиться → APIKS» (сборка №19): видео и звук из «Фото», «Файлов»,
  # мессенджеров — в общую папку, приложение забирает их (MediaInbox.swift).
  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.piks.app.share
        PRODUCT_NAME: ShareExtension
        INFOPLIST_FILE: ShareExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: ShareExtension/ShareExtension.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: GR3WB4Z646
        CODE_SIGN_STYLE: Manual
        SKIP_INSTALL: YES

  ReverseTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/ReverseMediaTests.swift
      - path: App/ReverseMedia.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.piks.reverse.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO

  ReverseMacTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "12.0"
    sources:
      - path: Tests/ReverseMediaTests.swift
      - path: App/ReverseMedia.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.piks.reverse.mac.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO

  ExportMacTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "12.0"
    sources:
      - path: Tests/NativeExportTests.swift
      - path: App/NativeExport.swift
      - path: App/ExportAudio.swift
      - path: App/ExportDiagnostics.swift
      - path: Tests/Fixtures
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.piks.export.mac.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO

schemes:
  ExportMacTests:
    build:
      targets:
        ExportMacTests: all
    test:
      targets:
        - ExportMacTests
  ReverseTests:
    build:
      targets:
        ReverseTests: all
    test:
      targets:
        - ReverseTests
  ReverseMacTests:
    build:
      targets:
        ReverseMacTests: all
    test:
      targets:
        - ReverseMacTests
