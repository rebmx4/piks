name: Piks

options:
  bundleIdPrefix: com.piks
  deploymentTarget:
    iOS: "15.0"
  developmentLanguage: ru
  generateEmptyDirectories: true

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_LANGUAGE: ru

targets:
  App:
    type: application
    platform: iOS
    sources:
      - path: App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.piks.app
        PRODUCT_NAME: Piks
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: GR3WB4Z646
        CODE_SIGN_STYLE: Manual
